<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Крипто Арбитраж</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            padding-bottom: 32px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--tg-theme-hint-color, #999);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999);
        }

        .section {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--tg-theme-hint-color, #999);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .select-group {
            margin-bottom: 16px;
        }

        .select-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--tg-theme-text-color, #000);
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid var(--tg-theme-hint-color, #ddd);
            border-radius: 8px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23999' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 36px;
        }

        select:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #0088cc);
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid var(--tg-theme-hint-color, #ddd);
            border-radius: 8px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }

        input[type="number"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #0088cc);
        }

        .input-suffix {
            position: relative;
        }

        .input-suffix input {
            padding-right: 40px;
        }

        .input-suffix::after {
            content: '%';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--tg-theme-hint-color, #999);
            font-size: 16px;
            pointer-events: none;
        }

        .profit-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: white;
            margin-bottom: 16px;
        }

        .profit-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .profit-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profit-value.positive {
            color: #4ade80;
        }

        .profit-value.negative {
            color: #f87171;
        }

        .profit-description {
            font-size: 13px;
            opacity: 0.8;
        }

        .exchange-badge {
            display: inline-block;
            padding: 4px 8px;
            background: var(--tg-theme-button-color, #0088cc);
            color: white;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-right: 4px;
        }

        .info-box {
            background: rgba(0, 136, 204, 0.1);
            border-left: 3px solid var(--tg-theme-button-color, #0088cc);
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            line-height: 1.5;
            margin-top: 16px;
        }

        .strategy-preview {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.6;
            margin-top: 12px;
        }

        .strategy-preview strong {
            color: var(--tg-theme-button-color, #0088cc);
        }

        .toggle-button {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid var(--tg-theme-button-color, #0088cc);
            border-radius: 10px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .toggle-button:active {
            transform: scale(0.98);
        }

        .toggle-button.online {
            background-color: var(--tg-theme-button-color, #0088cc);
            color: white;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #6b7280;
            transition: all 0.3s ease;
        }

        .status-indicator.online {
            background-color: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .online-data {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--tg-theme-hint-color, #ddd);
        }

        .online-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .online-item:last-child {
            border-bottom: none;
        }

        .online-label {
            font-size: 15px;
            font-weight: 500;
            color: var(--tg-theme-text-color, #000);
        }

        .online-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--tg-theme-button-color, #0088cc);
        }

        .coin-section {
            text-align: center;
            padding: 24px 16px;
        }

        .coin-input {
            width: 100%;
            max-width: 200px;
            padding: 16px;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            border: 2px solid var(--tg-theme-button-color, #0088cc);
            border-radius: 12px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            text-transform: uppercase;
        }

        .coin-input:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #0088cc);
            box-shadow: 0 0 0 3px rgba(0, 136, 204, 0.1);
        }

        .coin-input::placeholder {
            color: var(--tg-theme-hint-color, #999);
        }

        .positions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (max-width: 480px) {
            .positions-grid {
                gap: 8px;
            }
        }

        #spreadChart {
            width: 100%;
            height: 300px;
            margin-top: 16px;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Крипто Арбитраж</h1>
            <p>Настройка стратегии</p>
        </div>

        <!-- Выбор монеты -->
        <div class="section coin-section">
            <div class="input-group">
                <input type="text" id="coinSymbol" placeholder="BTC" class="coin-input">
            </div>
        </div>

        <!-- Позиции в два столбца -->
        <div class="positions-grid">
            <!-- Шорт позиция -->
            <div class="section">
                <div class="section-title">🔴 Шорт</div>
                
                <div class="select-group">
                    <label>Биржа</label>
                    <select id="shortExchange">
                        <option value="">Выберите</option>
                        <option value="binance">Binance</option>
                        <option value="bingx">BingX</option>
                        <option value="bitget">Bitget</option>
                        <option value="bitmart">BitMart</option>
                        <option value="bitmex">Bitmex</option>
                        <option value="bybit">Bybit</option>
                        <option value="coinex">CoinEx</option>
                        <option value="gateio">Gate.io</option>
                        <option value="htx">HTX</option>
                        <option value="hyperliquid">HyperLiquid</option>
                        <option value="kucoin">KuCoin</option>
                        <option value="lbank">LBank</option>
                        <option value="mexc">MEXC</option>
                        <option value="okx">OKX</option>
                        <option value="ourbit">Ourbit</option>
                        <option value="xt">XT</option>
                    </select>
                </div>

                <div class="select-group">
                    <label>Тип</label>
                    <select id="shortType">
                        <option value="futures">Фьючерс</option>
                        <option value="spot">Спот</option>
                    </select>
                </div>
            </div>

            <!-- Лонг позиция -->
            <div class="section">
                <div class="section-title">🟢 Лонг</div>
                
                <div class="select-group">
                    <label>Биржа</label>
                    <select id="longExchange">
                        <option value="">Выберите</option>
                        <option value="binance">Binance</option>
                        <option value="bingx">BingX</option>
                        <option value="bitget">Bitget</option>
                        <option value="bitmart">BitMart</option>
                        <option value="bitmex">Bitmex</option>
                        <option value="bybit">Bybit</option>
                        <option value="coinex">CoinEx</option>
                        <option value="gateio">Gate.io</option>
                        <option value="htx">HTX</option>
                        <option value="hyperliquid">HyperLiquid</option>
                        <option value="kucoin">KuCoin</option>
                        <option value="lbank">LBank</option>
                        <option value="mexc">MEXC</option>
                        <option value="okx">OKX</option>
                        <option value="ourbit">Ourbit</option>
                        <option value="xt">XT</option>
                    </select>
                </div>

                <div class="select-group">
                    <label>Тип</label>
                    <select id="longType">
                        <option value="futures">Фьючерс</option>
                        <option value="spot">Спот</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Онлайн режим -->
        <div class="section">
            <button id="toggleOnline" class="toggle-button">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="toggleText">Online спред + фандинг</span>
            </button>
            
            <div id="onlineData" class="online-data" style="display: none;">
                <div class="online-item">
                    <div class="online-label">📈 Спред входа</div>
                    <div class="online-value" id="liveEntrySpread">--%</div>
                </div>
                <div class="online-item">
                    <div class="online-label">📉 Спред выхода</div>
                    <div class="online-value" id="liveExitSpread">--%</div>
                </div>
                <div class="online-item">
                    <div class="online-label">💰 Фандинг</div>
                    <div class="online-value" id="liveFunding">--%</div>
                </div>
                
                <!-- График истории спреда -->
                <div id="spreadChart"></div>
            </div>
        </div>

        <!-- Спреды -->
        <div class="section">
            <div class="section-title">Параметры входа/выхода</div>
            
            <div class="input-group">
                <label>📈 Спред входа</label>
                <div class="input-suffix">
                    <input type="number" id="entrySpread" value="1.5" step="0.1" min="0" placeholder="1.5">
                </div>
            </div>

            <div class="input-group">
                <label>📉 Спред выхода</label>
                <div class="input-suffix">
                    <input type="number" id="exitSpread" value="0.5" step="0.1" min="0" placeholder="0.5">
                </div>
            </div>
        </div>

        <!-- Расчет прибыли -->
        <div class="profit-display">
            <div class="profit-label">Ожидаемая прибыль</div>
            <div class="profit-value" id="profitValue">0.00%</div>
            <div class="profit-description">Разница между входом и выходом</div>
        </div>

        <!-- Предпросмотр стратегии -->
        <div class="info-box">
            <strong>📋 Стратегия:</strong>
            <div class="strategy-preview" id="strategyPreview">
                Выберите биржи и установите спреды для просмотра стратегии
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Элементы
        const coinSymbol = document.getElementById('coinSymbol');
        const shortExchange = document.getElementById('shortExchange');
        const shortType = document.getElementById('shortType');
        const longExchange = document.getElementById('longExchange');
        const longType = document.getElementById('longType');
        const entrySpread = document.getElementById('entrySpread');
        const exitSpread = document.getElementById('exitSpread');
        const profitValue = document.getElementById('profitValue');
        const strategyPreview = document.getElementById('strategyPreview');
        
        // Онлайн режим
        const toggleOnline = document.getElementById('toggleOnline');
        const statusIndicator = document.getElementById('statusIndicator');
        const toggleText = document.getElementById('toggleText');
        const onlineData = document.getElementById('onlineData');
        const liveEntrySpread = document.getElementById('liveEntrySpread');
        const liveExitSpread = document.getElementById('liveExitSpread');
        const liveFunding = document.getElementById('liveFunding');
        
        let isOnline = false;
        let updateInterval = null;
        
        // График
        let chart = null;
        let entrySpreadSeries = null;
        let exitSpreadSeries = null;
        let entryLevelLine = null;
        let exitLevelLine = null;
        let lastUserInteraction = Date.now();
        let autoScroll = true;

        // Функция расчета прибыли
        function calculateProfit() {
            const entry = parseFloat(entrySpread.value) || 0;
            const exit = parseFloat(exitSpread.value) || 0;
            const profit = entry - exit;
            
            profitValue.textContent = profit.toFixed(2) + '%';
            profitValue.className = 'profit-value ' + (profit > 0 ? 'positive' : profit < 0 ? 'negative' : '');
            
            updateStrategyPreview();
        }

        // Функция обновления превью стратегии
        function updateStrategyPreview() {
            const short = shortExchange.value;
            const long = longExchange.value;
            const coin = coinSymbol.value.toUpperCase() || 'МОНЕТА';
            const sType = shortType.options[shortType.selectedIndex].text;
            const lType = longType.options[longType.selectedIndex].text;
            const entry = parseFloat(entrySpread.value) || 0;
            const exit = parseFloat(exitSpread.value) || 0;
            
            if (!short || !long) {
                strategyPreview.innerHTML = 'Выберите биржи и установите спреды для просмотра стратегии';
                return;
            }
            
            const shortName = shortExchange.options[shortExchange.selectedIndex].text;
            const longName = longExchange.options[longExchange.selectedIndex].text;
            
            strategyPreview.innerHTML = `
                <strong>Вход в позицию:</strong><br>
                Когда спред достигнет <strong>${entry}%</strong>:<br>
                • Открыть SHORT на <strong>${shortName}</strong> (${coin}/${sType})<br>
                • Открыть LONG на <strong>${longName}</strong> (${coin}/${lType})<br>
                <br>
                <strong>Выход из позиции:</strong><br>
                Когда спред сузится до <strong>${exit}%</strong>:<br>
                • Закрыть обе позиции<br>
                • Зафиксировать прибыль <strong>~${(entry - exit).toFixed(2)}%</strong>
            `;
        }

        // Функция переключения онлайн режима
        function toggleOnlineMode() {
            isOnline = !isOnline;
            
            if (isOnline) {
                toggleOnline.classList.add('online');
                statusIndicator.classList.add('online');
                toggleText.textContent = 'Online спред + фандинг';
                onlineData.style.display = 'block';
                autoScroll = true; // Включаем автоскролл
                
                // Небольшая задержка чтобы контейнер успел отрисоваться
                setTimeout(() => {
                    initChart();
                    startUpdating();
                }, 100);
            } else {
                toggleOnline.classList.remove('online');
                statusIndicator.classList.remove('online');
                toggleText.textContent = 'Online спред + фандинг';
                onlineData.style.display = 'none';
                stopUpdating();
            }
        }

        // Инициализация графика
        function initChart() {
            if (chart) return; // Уже создан
            
            // Проверяем что библиотека загрузилась
            if (typeof LightweightCharts === 'undefined') {
                console.error('TradingView библиотека не загружена');
                return;
            }
            
            const chartContainer = document.getElementById('spreadChart');
            
            try {
                chart = LightweightCharts.createChart(chartContainer, {
                    width: chartContainer.clientWidth,
                    height: 300,
                    layout: {
                        background: { color: '#1e293b' },
                        textColor: '#d1d5db',
                    },
                    grid: {
                        vertLines: { color: '#334155' },
                        horzLines: { color: '#334155' },
                    },
                    timeScale: {
                        timeVisible: true,
                        secondsVisible: true,
                    },
                    rightPriceScale: {
                        visible: true,
                    },
                    leftPriceScale: {
                        visible: false,
                    },
                    crosshair: {
                        mode: LightweightCharts.CrosshairMode.Normal,
                    },
                });
                
                // Отслеживаем взаимодействие пользователя с графиком
                chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
                    lastUserInteraction = Date.now();
                    autoScroll = false;
                });
                
                // Восстанавливаем автоследование через 10 секунд
                setInterval(() => {
                    if (!autoScroll && Date.now() - lastUserInteraction > 10000) {
                        autoScroll = true;
                    }
                }, 1000);

                // Линия спреда входа (зеленая)
                entrySpreadSeries = chart.addLineSeries({
                    color: '#10b981',
                    lineWidth: 2,
                    title: 'Спред входа',
                });

                // Линия спреда выхода (красная)
                exitSpreadSeries = chart.addLineSeries({
                    color: '#ef4444',
                    lineWidth: 2,
                    title: 'Спред выхода',
                });
                
                // Добавляем горизонтальные линии уровней
                updateLevelLines();
                
                // Включаем перетаскивание линий
                enableLineDragging();
                
                // Адаптивность при изменении размера окна
                window.addEventListener('resize', () => {
                    if (chart) {
                        chart.applyOptions({ 
                            width: chartContainer.clientWidth 
                        });
                    }
                });
                
                // Двойной клик по графику - возврат к последним данным
                chartContainer.addEventListener('dblclick', () => {
                    if (chart) {
                        autoScroll = true;
                        chart.timeScale().scrollToRealTime();
                    }
                });
                
                // Загружаем историю
                loadHistory();
                
                console.log('График инициализирован');
            } catch (error) {
                console.error('Ошибка инициализации графика:', error);
            }
        }

        // Обновление линий уровней на графике
        function updateLevelLines() {
            if (!entrySpreadSeries || !exitSpreadSeries) return;
            
            const entryLevel = parseFloat(entrySpread.value) || 1.5;
            const exitLevel = parseFloat(exitSpread.value) || 0.5;
            
            // Удаляем старые линии если есть
            if (entryLevelLine) {
                entrySpreadSeries.removePriceLine(entryLevelLine);
            }
            if (exitLevelLine) {
                exitSpreadSeries.removePriceLine(exitLevelLine);
            }
            
            // Линия уровня входа (зеленая пунктирная)
            entryLevelLine = entrySpreadSeries.createPriceLine({
                price: entryLevel,
                color: '#10b981',
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Dashed,
                axisLabelVisible: true,
                title: 'Вход ' + entryLevel + '%',
            });
            
            // Линия уровня выхода (красная пунктирная)
            exitLevelLine = exitSpreadSeries.createPriceLine({
                price: exitLevel,
                color: '#ef4444',
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Dashed,
                axisLabelVisible: true,
                title: 'Выход ' + exitLevel + '%',
            });
            
            // Нулевая линия (серая)
            entrySpreadSeries.createPriceLine({
                price: 0,
                color: '#64748b',
                lineWidth: 1,
                lineStyle: LightweightCharts.LineStyle.Solid,
                axisLabelVisible: false,
                title: '',
            });
        }
        
        // Функция для перетаскивания линий мышкой
        function enableLineDragging() {
            if (!chart) return;
            
            let isDragging = false;
            let dragTarget = null; // 'entry' или 'exit'
            
            const chartElement = document.getElementById('spreadChart');
            
            chartElement.addEventListener('mousedown', (e) => {
                const rect = chartElement.getBoundingClientRect();
                const price = entrySpreadSeries.coordinateToPrice(e.clientY - rect.top);
                
                if (!price) return;
                
                const entryLevel = parseFloat(entrySpread.value) || 1.5;
                const exitLevel = parseFloat(exitSpread.value) || 0.5;
                
                // Проверяем, близко ли к линии входа (порог 0.1%)
                if (Math.abs(price - entryLevel) < 0.1) {
                    isDragging = true;
                    dragTarget = 'entry';
                    e.preventDefault();
                }
                // Проверяем линию выхода
                else if (Math.abs(price - exitLevel) < 0.1) {
                    isDragging = true;
                    dragTarget = 'exit';
                    e.preventDefault();
                }
            });
            
            chartElement.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const rect = chartElement.getBoundingClientRect();
                const price = entrySpreadSeries.coordinateToPrice(e.clientY - rect.top);
                
                if (!price || price < 0) return;
                
                // Обновляем значение и линию
                if (dragTarget === 'entry') {
                    entrySpread.value = price.toFixed(2);
                } else if (dragTarget === 'exit') {
                    exitSpread.value = price.toFixed(2);
                }
                
                calculateProfit();
                updateLevelLines();
            });
            
            chartElement.addEventListener('mouseup', () => {
                isDragging = false;
                dragTarget = null;
            });
            
            chartElement.addEventListener('mouseleave', () => {
                isDragging = false;
                dragTarget = null;
            });
        }

        // Загрузка истории спреда
        async function loadHistory() {
            const coin = coinSymbol.value.toUpperCase();
            const short = shortExchange.value;
            const long = longExchange.value;
            const sType = shortType.value;
            const lType = longType.value;
            
            if (!coin || !short || !long) return;
            
            const API_URL = 'http://localhost:8000';
            
            try {
                const response = await fetch(
                    `${API_URL}/api/spread/history?coin=${coin}&short_exchange=${short}&short_type=${sType}&long_exchange=${long}&long_type=${lType}&limit=100`
                );
                
                if (!response.ok) return;
                
                const result = await response.json();
                const history = result.data;
                
                if (!history || history.length === 0) return;
                
                // Форматируем данные для графика
                const entryData = history.map(point => ({
                    time: point.time,
                    value: point.entry_spread
                }));
                
                const exitData = history.map(point => ({
                    time: point.time,
                    value: point.exit_spread
                }));
                
                entrySpreadSeries.setData(entryData);
                exitSpreadSeries.setData(exitData);
                
            } catch (error) {
                console.error('Ошибка загрузки истории:', error);
            }
        }

        // Обновление графика новой точкой
        function updateChart(entrySpread, exitSpread) {
            if (!chart) return;
            
            const timestamp = Date.now() / 1000;
            
            entrySpreadSeries.update({
                time: timestamp,
                value: entrySpread
            });
            
            exitSpreadSeries.update({
                time: timestamp,
                value: exitSpread
            });
            
            // Если автоскролл включен - двигаем к последним данным
            if (autoScroll) {
                chart.timeScale().scrollToRealTime();
            }
        }

        // Функция запуска обновления данных
        function startUpdating() {
            updateLiveData(); // Первое обновление сразу
            updateInterval = setInterval(updateLiveData, 500); // Обновление каждые 500мс
        }

        // Функция остановки обновления данных
        function stopUpdating() {
            if (updateInterval) {
                clearInterval(updateInterval);
                updateInterval = null;
            }
        }

        // Функция обновления онлайн данных
        async function updateLiveData() {
            // Проверяем, что все данные заполнены
            const coin = coinSymbol.value.toUpperCase();
            const short = shortExchange.value;
            const long = longExchange.value;
            const sType = shortType.value;
            const lType = longType.value;
            
            if (!coin || !short || !long) {
                liveEntrySpread.textContent = '--';
                liveExitSpread.textContent = '--';
                liveFunding.textContent = '--';
                return;
            }
            
            // API URL - локальный бэкенд
            const API_URL = 'http://localhost:8000';
            
            try {
                // Запрос к бэкенду для расчета спреда
                const response = await fetch(`${API_URL}/api/spread`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        coin: coin,
                        short_exchange: short,
                        short_type: sType,
                        long_exchange: long,
                        long_type: lType
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                // Обновляем данные на экране
                liveEntrySpread.textContent = data.entry_spread.toFixed(2) + '%';
                liveExitSpread.textContent = data.exit_spread.toFixed(2) + '%';
                liveFunding.textContent = data.funding_rate.toFixed(4) + '%';
                
                // Обновляем график
                updateChart(data.entry_spread, data.exit_spread);
                
            } catch (error) {
                console.error('Ошибка получения данных:', error);
                liveEntrySpread.textContent = 'Ошибка';
                liveExitSpread.textContent = 'Ошибка';
                liveFunding.textContent = 'Ошибка';
            }
        }

        // Слушатели событий
        toggleOnline.addEventListener('click', toggleOnlineMode);
        coinSymbol.addEventListener('input', calculateProfit);
        shortExchange.addEventListener('change', calculateProfit);
        shortType.addEventListener('change', calculateProfit);
        longExchange.addEventListener('change', calculateProfit);
        longType.addEventListener('change', calculateProfit);
        entrySpread.addEventListener('input', () => {
            calculateProfit();
            updateLevelLines();
        });
        exitSpread.addEventListener('input', () => {
            calculateProfit();
            updateLevelLines();
        });

        // Инициализация
        calculateProfit();

        // Настройка главной кнопки Telegram
        if (tg) {
            tg.MainButton.text = "Сохранить стратегию";
            tg.MainButton.show();
            tg.MainButton.onClick(() => {
                const data = {
                    coin: coinSymbol.value.toUpperCase(),
                    shortExchange: shortExchange.value,
                    shortType: shortType.value,
                    longExchange: longExchange.value,
                    longType: longType.value,
                    entrySpread: parseFloat(entrySpread.value),
                    exitSpread: parseFloat(exitSpread.value),
                    expectedProfit: (parseFloat(entrySpread.value) - parseFloat(exitSpread.value)).toFixed(2)
                };
                
                // Отправка данных боту
                tg.sendData(JSON.stringify(data));
            });
        }
    </script>
</body>
