<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Крипто Арбитраж</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="common.css">
    <style>
        /* Main viewport */
        .viewport {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 0;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            color: var(--color-success);
            background: rgba(22, 163, 74, 0.1);
            border-radius: 20px;
            padding: 4px 10px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-success);
            animation: livepulse 2s infinite;
        }

        @keyframes livepulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }



        /* Strategy tabs */
        .strategy-tabs {
            display: flex;
            gap: 8px;
            padding: 0 16px 12px;
        }
        .strat-tab {
            flex: 1;
            min-height: 44px;
            border: none;
            border-radius: 10px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-hint-color, #888);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.3px;
            cursor: pointer;
        }
        .strat-tab.strat-active {
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
        }

        /* Cards list */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Row 1: coin name + spread pill */
        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 7px;
        }

        .card-coin-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--tg-theme-text-color, #000000);
            line-height: 1;
        }

        .spread-pills {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
        }

        .spread-pill {
            font-size: 15px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            line-height: 1;
        }

        .pill-label {
            font-size: 11px;
            font-weight: 500;
            opacity: 0.6;
            margin-right: 3px;
        }

        .pill-green  { color: var(--color-success); background: rgba(22, 163, 74, 0.12); }
        .pill-yellow { color: var(--color-warning); background: rgba(217, 119, 6, 0.12); }
        .pill-red    { color: var(--color-danger); background: rgba(220, 38, 38, 0.12); }

        /* Row 2: direction Long → Short */
        .card-exchanges {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--tg-theme-hint-color, #64748b);
        }

        .tag-l {
            font-size: 11px;
            font-weight: 700;
            color: var(--color-success);
            background: rgba(22, 163, 74, 0.1);
            padding: 2px 6px;
            border-radius: 5px;
            letter-spacing: 0.2px;
        }

        .tag-s {
            font-size: 11px;
            font-weight: 700;
            color: var(--color-danger);
            background: rgba(220, 38, 38, 0.08);
            padding: 2px 6px;
            border-radius: 5px;
            letter-spacing: 0.2px;
        }

        .exch-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--tg-theme-text-color, #000000);
        }

        .exch-block {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1px;
        }

        .exch-price {
            font-size: 11px;
            color: var(--tg-theme-hint-color, #64748b);
        }

        .exch-arrow {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #64748b);
            margin: 0 1px;
        }

        /* Row 3: stat blocks */
        .card-stats {
            display: flex;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding-top: 10px;
        }

        .stat-block {
            flex: 1;
            text-align: center;
        }

        .stat-block + .stat-block {
            border-left: 1px solid rgba(0, 0, 0, 0.08);
        }

        .stat-lbl {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: var(--tg-theme-hint-color, #64748b);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 3px;
        }

        .stat-val {
            display: block;
            font-size: 13px;
            font-weight: 600;
        }

        .val-green { color: var(--color-success); }
        .val-red   { color: var(--color-danger); }
        .val-dim   { color: var(--tg-theme-hint-color, #64748b); }

        /* Details toggle button */
        .details-btn {
            width: calc(100% + 28px);
            margin: 10px -14px -12px;
            padding: 10px 16px;
            min-height: 44px;
            background: transparent;
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            color: var(--tg-theme-hint-color, #64748b);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border-radius: 0 0 11px 11px;
            transition: background 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .details-btn:active { background: rgba(0, 0, 0, 0.04); }

        .details-chevron {
            display: inline-block;
            font-size: 12px;
            transition: transform 0.2s ease;
            line-height: 1;
        }

        .stat-card.expanded .details-chevron {
            transform: rotate(180deg);
        }

        /* Expanded detail block */
        .card-detail {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.25s ease;
        }

        .stat-card.expanded .card-detail {
            max-height: 500px;
        }

        .detail-inner {
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            margin-top: 10px;
            padding-top: 12px;
        }

        /* SVG chart */
        .chart-caption {
            font-size: 11px;
            font-weight: 500;
            color: var(--tg-theme-hint-color, #64748b);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .chart-wrap {
            margin-bottom: 12px;
            border-radius: 6px;
            overflow: hidden;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
        }

        .chart-wrap svg {
            width: 100%;
            height: 60px;
            display: block;
        }

        .chart-empty {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--tg-theme-hint-color, #64748b);
        }

        /* Tier sections */
        .tier-block {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .tier-block:last-child { margin-bottom: 0; }

        .tier-label {
            font-size: 11px;
            color: var(--tg-theme-hint-color, #64748b);
            margin-bottom: 7px;
        }

        .btn-alert {
            width: 100%;
            padding: 8px 14px;
            background: rgba(0, 136, 204, 0.12);
            border: none;
            border-radius: 10px;
            color: var(--tg-theme-button-color, #0088cc);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
            transition: opacity 0.15s ease;
        }

        .btn-alert:active { opacity: 0.75; }

        /* Locked orderbook */
        .tier-locked {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            max-height: 90px;
        }

        .ob-mock {
            filter: blur(4px);
            pointer-events: none;
            user-select: none;
            font-size: 11px;
            color: var(--tg-theme-hint-color, #64748b);
            line-height: 2;
            font-variant-numeric: tabular-nums;
        }

        .ob-ask { color: var(--color-danger); }
        .ob-bid { color: var(--color-success); }

        .lock-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent 0%, var(--tg-theme-secondary-bg-color, #f5f5f5) 60%);
            display: flex;
            align-items: flex-end;
            padding-bottom: 4px;
        }

        .lock-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--tg-theme-hint-color, #64748b);
        }

        /* Upgrade CTA button */
        .tier-upgrade-btn {
            display: block;
            width: 100%;
            height: 44px;
            margin-top: 8px;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: opacity 0.15s ease;
        }

        .tier-upgrade-btn:active { opacity: 0.8; }

        /* Empty state CTA */
        .empty-cta-btn {
            display: block;
            margin: 8px auto 0;
            background: none;
            border: 1px solid currentColor;
            border-radius: 6px;
            padding: 6px 14px;
            cursor: pointer;
            opacity: 0.7;
            font-family: inherit;
            font-size: 13px;
            color: var(--tg-theme-hint-color, #64748b);
            -webkit-tap-highlight-color: transparent;
        }

        /* Loading / error states */
        .screener-status {
            text-align: center;
            padding: 32px 16px;
            color: var(--tg-theme-hint-color, #64748b);
            font-size: 14px;
        }

        .screener-loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 136, 204, 0.2);
            border-top-color: var(--tg-theme-button-color, #0088cc);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="viewport">

        <div class="page-header">
            <span class="page-title">Скринер</span>
            <div class="live-badge" id="liveBadge">
                <div class="live-dot"></div>
                <span id="liveBadgeText">LIVE</span>
            </div>
        </div>

        <div class="strategy-tabs" id="strategyTabs">
            <button class="strat-tab strat-active" data-strategy="arb">Арбитраж</button>
            <button class="strat-tab" data-strategy="funding">Фандинг</button>
            <button class="strat-tab" data-strategy="combo">Комбо</button>
        </div>

        <div class="cards-list" id="cardsList">
            <div class="screener-status">
                <div class="screener-loader"></div>
                <div>Загрузка данных...</div>
            </div>
        </div>
        <div id="sentinel"></div>

    </div>

    <div class="nav-tabs">
        <a href="index.html" class="nav-tab active">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Скринер</span>
        </a>
        <a href="deals.html" class="nav-tab">
            <span class="nav-icon">📑</span>
            <span class="nav-label">Сделки</span>
        </a>
        <a href="account.html" class="nav-tab">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Аккаунт</span>
        </a>
    </div>

    <script>
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        var API_BASE = 'http://localhost:8000';
        var PAGE_SIZE = 15;

        /* ── State ───────────────────────────────────────────────── */
        var currentTab = 'arbitrage';
        var sortDir = 'desc';
        var currentSortBy = 'spread_pct';
        var pollIntervalId = null;
        var lastFetchFailed = false;
        var currentOffset = 0;
        var lastItems = [];
        var isPaused = false;
        var _debounceTimer = null;
        var _pauseTimer = null;
        var _abortController = null;

        /* История спредов для мини-графиков: ключ = "coin|long|short" */
        window._spreadHistory = {};

        /* ── Helpers ─────────────────────────────────────────────── */

        function fmtPct(val) {
            if (val === null || val === undefined || isNaN(val)) return '—';
            var sign = val >= 0 ? '+' : '';
            return sign + parseFloat(val).toFixed(3) + '%';
        }

        function spreadPillClass(pct) {
            if (pct >= 0.5) return 'pill-green';
            if (pct >= 0)   return 'pill-yellow';
            return 'pill-red';
        }

        function fundingValClass(val) {
            if (val > 0) return 'val-green';
            if (val < 0) return 'val-red';
            return 'val-dim';
        }

        function haptic(type) {
            if (tg && tg.HapticFeedback) {
                if (type === 'selection') tg.HapticFeedback.selectionChanged();
                else tg.HapticFeedback.impactOccurred(type || 'light');
            }
        }

        function formatApiError(errObj, fallback) {
            if (!errObj) return fallback || 'Неизвестная ошибка';
            var detail = errObj.detail || fallback || 'Неизвестная ошибка';
            if (errObj.error) return detail + ' [' + errObj.error + ']';
            return detail;
        }

        /* ── History accumulation ────────────────────────────────── */

        function addToHistory(item) {
            var key = item.coin + '|' + item.long_exchange + '|' + item.short_exchange;
            if (!window._spreadHistory[key]) {
                window._spreadHistory[key] = [];
            }
            var hist = window._spreadHistory[key];
            hist.push(item.spread_pct);
            if (hist.length > 60) hist.shift();
        }

        /* ── SVG sparkline ───────────────────────────────────────── */

        function buildSparkline(points) {
            /* points: array of numbers */
            if (!points || points.length < 2) return null;

            var W = 280, H = 60, pad = 4;
            var min = Math.min.apply(null, points);
            var max = Math.max.apply(null, points);
            var range = max - min || 1;

            var pts = points.map(function(v, i) {
                var x = pad + (i / (points.length - 1)) * (W - pad * 2);
                var y = H - pad - ((v - min) / range) * (H - pad * 2);
                return x.toFixed(1) + ',' + y.toFixed(1);
            }).join(' ');

            return pts;
        }

        function renderSparklineInto(el, key) {
            var hist = window._spreadHistory[key];
            var pts = hist && hist.length >= 2 ? buildSparkline(hist) : null;

            if (!pts) {
                el.innerHTML = '<div class="chart-empty">Накапливается...</div>';
                return;
            }

            var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 280 60');
            svg.style.width = '100%';
            svg.style.height = '60px';
            svg.style.display = 'block';

            var polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
            polyline.setAttribute('points', pts);
            polyline.setAttribute('fill', 'none');
            polyline.setAttribute('stroke', (tg && tg.themeParams && tg.themeParams.button_color) || '#0088cc');
            polyline.setAttribute('stroke-width', '2');
            polyline.setAttribute('stroke-linejoin', 'round');
            polyline.setAttribute('stroke-linecap', 'round');

            svg.appendChild(polyline);

            el.innerHTML = '';
            el.appendChild(svg);
        }

        /* ── Card rendering ──────────────────────────────────────── */

        function buildCard(item) {
            var key = item.coin + '|' + item.long_exchange + '|' + item.short_exchange;
            var pct = typeof item.spread_pct === 'number' ? item.spread_pct : 0;
            var pillCls = spreadPillClass(pct);
            var flVal = typeof item.funding_long === 'number' ? item.funding_long : 0;
            var fsVal = typeof item.funding_short === 'number' ? item.funding_short : 0;
            var totalVal = typeof item.total_yield_pct === 'number' ? item.total_yield_pct : 0;

            /* Outer card */
            var card = document.createElement('div');
            card.className = 'card stat-card';
            card.dataset.key = key;

            /* Row 1: coin + pill */
            var top = document.createElement('div');
            top.className = 'card-top';

            var coinEl = document.createElement('span');
            coinEl.className = 'card-coin-name';
            coinEl.textContent = item.coin;

            var pillsWrap = document.createElement('div');
            pillsWrap.className = 'spread-pills';

            var pill = document.createElement('span');
            pill.className = 'spread-pill ' + pillCls;
            var pillLbl = document.createElement('span');
            pillLbl.className = 'pill-label';
            pillLbl.textContent = 'Вход';
            pill.insertBefore(pillLbl, pill.firstChild);
            pill.appendChild(document.createTextNode(fmtPct(pct)));
            pillsWrap.appendChild(pill);

            if (typeof item.exit_spread_pct === 'number') {
                var exitPct = item.exit_spread_pct;
                var exitPill = document.createElement('span');
                exitPill.className = 'spread-pill ' + spreadPillClass(exitPct);
                var exitLbl = document.createElement('span');
                exitLbl.className = 'pill-label';
                exitLbl.textContent = 'Выход';
                exitPill.appendChild(exitLbl);
                exitPill.appendChild(document.createTextNode(fmtPct(exitPct)));
                pillsWrap.appendChild(exitPill);
            }

            top.appendChild(coinEl);
            top.appendChild(pillsWrap);

            /* Row 2: exchanges */
            var exRow = document.createElement('div');
            exRow.className = 'card-exchanges';

            var tagL = document.createElement('span');
            tagL.className = 'tag-l';
            tagL.textContent = 'L';

            var longBlock = document.createElement('span');
            longBlock.className = 'exch-block';
            var longName = document.createElement('span');
            longName.className = 'exch-name';
            longName.textContent = item.long_exchange;
            longBlock.appendChild(longName);
            if (item.price_long != null) {
                var longPrice = document.createElement('span');
                longPrice.className = 'exch-price';
                var pLong = parseFloat(item.price_long);
                longPrice.textContent = '$' + pLong.toLocaleString('en-US', { maximumFractionDigits: pLong >= 1 ? 2 : 6 });
                longBlock.appendChild(longPrice);
            }

            var arrow = document.createElement('span');
            arrow.className = 'exch-arrow';
            arrow.textContent = '→';

            var tagS = document.createElement('span');
            tagS.className = 'tag-s';
            tagS.textContent = 'S';

            var shortBlock = document.createElement('span');
            shortBlock.className = 'exch-block';
            var shortName = document.createElement('span');
            shortName.className = 'exch-name';
            shortName.textContent = item.short_exchange;
            shortBlock.appendChild(shortName);
            if (item.price_short != null) {
                var shortPrice = document.createElement('span');
                shortPrice.className = 'exch-price';
                var pShort = parseFloat(item.price_short);
                shortPrice.textContent = '$' + pShort.toLocaleString('en-US', { maximumFractionDigits: pShort >= 1 ? 2 : 6 });
                shortBlock.appendChild(shortPrice);
            }

            exRow.appendChild(tagL);
            exRow.appendChild(longBlock);
            exRow.appendChild(arrow);
            exRow.appendChild(tagS);
            exRow.appendChild(shortBlock);

            /* Row 3: stat blocks */
            var stats = document.createElement('div');
            stats.className = 'card-stats';

            function makeStatBlock(lbl, valText, valCls) {
                var blk = document.createElement('div');
                blk.className = 'stat-block';
                var lblEl = document.createElement('span');
                lblEl.className = 'stat-lbl';
                lblEl.textContent = lbl;
                var valEl = document.createElement('span');
                valEl.className = 'stat-val ' + valCls;
                valEl.textContent = valText;
                blk.appendChild(lblEl);
                blk.appendChild(valEl);
                return blk;
            }

            var fundingNet = fsVal - flVal;
            stats.appendChild(makeStatBlock('Фандинг', fmtPct(fundingNet), fundingValClass(fundingNet)));
            stats.appendChild(makeStatBlock('Итого', fmtPct(totalVal), totalVal >= 0.5 ? 'val-green' : totalVal < 0 ? 'val-red' : 'val-dim'));
            stats.appendChild(makeStatBlock('Объём', '--', 'val-dim'));

            /* Detail block (hidden until expand) */
            var detail = document.createElement('div');
            detail.className = 'card-detail';

            var inner = document.createElement('div');
            inner.className = 'detail-inner';

            /* Chart caption */
            var chartCap = document.createElement('div');
            chartCap.className = 'chart-caption';
            chartCap.textContent = 'График спреда · текущая сессия';

            /* Chart wrap */
            var chartWrap = document.createElement('div');
            chartWrap.className = 'chart-wrap';
            chartWrap.dataset.chartKey = key;
            chartWrap.innerHTML = '<div class="chart-empty">Накапливается...</div>';

            /* Tier block: Free — Alert */
            var tierFree = document.createElement('div');
            tierFree.className = 'tier-block';

            var tierFreeLabel = document.createElement('div');
            tierFreeLabel.className = 'tier-label';
            tierFreeLabel.textContent = 'Доступно Free';

            var btnAlert = document.createElement('button');
            btnAlert.className = 'btn-alert';
            btnAlert.textContent = 'Настроить алерт';
            btnAlert.addEventListener('click', function(e) {
                e.stopPropagation();
                haptic('light');
                /* TODO: открыть форму алерта */
            });

            tierFree.appendChild(tierFreeLabel);
            tierFree.appendChild(btnAlert);

            /* Tier block: Paid 1 — locked orderbook */
            var tierPaid = document.createElement('div');
            tierPaid.className = 'tier-block';

            var tierPaidLabel = document.createElement('div');
            tierPaidLabel.className = 'tier-label';
            tierPaidLabel.textContent = 'Узнай максимальный вход без проскальзывания · Paid 1';

            var tierLocked = document.createElement('div');
            tierLocked.className = 'tier-locked';

            var obMock = document.createElement('div');
            obMock.className = 'ob-mock';

            var mockRows = [
                { cls: 'ob-ask', qty: '0.1823 BTC', price: '95,420 USDT' },
                { cls: 'ob-ask', qty: '0.3541 BTC', price: '95,415 USDT' },
                { cls: 'ob-ask', qty: '0.8120 BTC', price: '95,410 USDT' },
                { cls: 'ob-bid', qty: '0.2234 BTC', price: '95,405 USDT' },
                { cls: 'ob-bid', qty: '0.4892 BTC', price: '95,400 USDT' },
                { cls: 'ob-bid', qty: '0.6017 BTC', price: '95,395 USDT' }
            ];

            mockRows.forEach(function(row) {
                var line = document.createElement('div');
                var span = document.createElement('span');
                span.className = row.cls;
                span.textContent = row.qty;
                line.appendChild(span);
                line.appendChild(document.createTextNode('  @  ' + row.price));
                obMock.appendChild(line);
            });

            var lockOverlay = document.createElement('div');
            lockOverlay.className = 'lock-overlay';
            var lockLabel = document.createElement('span');
            lockLabel.className = 'lock-label';
            lockLabel.textContent = 'Узнай максимальный вход без проскальзывания · Paid 1';
            lockOverlay.appendChild(lockLabel);

            tierLocked.appendChild(obMock);
            tierLocked.appendChild(lockOverlay);

            var upgradeBtn = document.createElement('button');
            upgradeBtn.className = 'tier-upgrade-btn';
            upgradeBtn.textContent = 'Открыть доступ · Paid 1';
            upgradeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                haptic('light');
                window.open('https://t.me/your_bot?start=upgrade', '_blank');
            });

            tierPaid.appendChild(tierPaidLabel);
            tierPaid.appendChild(tierLocked);
            tierPaid.appendChild(upgradeBtn);

            inner.appendChild(chartCap);
            inner.appendChild(chartWrap);
            inner.appendChild(tierFree);
            inner.appendChild(tierPaid);

            detail.appendChild(inner);

            /* Details button */
            var detBtn = document.createElement('button');
            detBtn.className = 'details-btn';

            var detBtnText = document.createTextNode('Подробнее ▼');
            var chevron = document.createElement('span');
            chevron.className = 'details-chevron';
            chevron.textContent = '';

            detBtn.appendChild(detBtnText);
            detBtn.appendChild(chevron);

            detBtn.addEventListener('click', function() {
                var wasExpanded = card.classList.contains('expanded');
                card.classList.toggle('expanded');
                haptic('light');

                detBtnText.nodeValue = wasExpanded ? 'Подробнее ▼' : 'Свернуть ▲';

                if (!wasExpanded) {
                    /* При открытии перерисовываем спарклайн */
                    renderSparklineInto(chartWrap, key);
                }
            });

            /* Assemble */
            card.appendChild(top);
            card.appendChild(exRow);
            card.appendChild(stats);
            card.appendChild(detail);
            card.appendChild(detBtn);

            return card;
        }

        function setTab(tabName) {
            var target = document.querySelector('#strategyTabs .strat-tab[data-strategy="' + tabName + '"]');
            if (target) {
                document.querySelectorAll('#strategyTabs .strat-tab').forEach(function(b) {
                    b.classList.remove('strat-active');
                    if (b.dataset.label) b.textContent = b.dataset.label;
                });
                target.classList.add('strat-active');
                currentTab = tabName;
                sortDir = 'desc';
                currentSortBy = (tabSortMap && tabSortMap[tabName]) || target.dataset.sort || 'spread_pct';
                if (target.dataset.label) {
                    target.textContent = target.dataset.label + ' ↓';
                }
                haptic('selection');
                fetchDebounced();
            }
        }

        function renderCards(items) {
            var list = document.getElementById('cardsList');
            if (!items || items.length === 0) {
                list.innerHTML = '';
                var empty = document.createElement('div');
                empty.className = 'screener-status';
                empty.textContent = 'Нет пар по выбранным фильтрам.';
                var ctaBtn = document.createElement('button');
                ctaBtn.className = 'empty-cta-btn';
                ctaBtn.textContent = 'Попробуй вкладку Комбо →';
                ctaBtn.addEventListener('click', function() { setTab('combo'); });
                list.appendChild(empty);
                list.appendChild(ctaBtn);
                return;
            }

            /* Сохраняем текущие expanded-ключи чтобы не схлопывать при ре-рендере */
            var expandedKeys = {};
            list.querySelectorAll('.stat-card.expanded').forEach(function(c) {
                expandedKeys[c.dataset.key] = true;
            });

            /* Удаляем старые карточки и статус */
            list.innerHTML = '';

            items.forEach(function(item) {
                var card = buildCard(item);
                if (expandedKeys[card.dataset.key]) {
                    card.classList.add('expanded');
                    /* Перерисуем чарт для раскрытых карточек */
                    var chartWrap = card.querySelector('[data-chart-key]');
                    if (chartWrap) {
                        renderSparklineInto(chartWrap, card.dataset.key);
                    }
                }
                list.appendChild(card);
            });
        }

        /* ── Append cards (infinite scroll) ─────────────────────── */

        function appendCards(items) {
            if (!items || items.length === 0) return;
            var list = document.getElementById('cardsList');
            items.forEach(function(item) {
                var card = buildCard(item);
                list.appendChild(card);
            });
        }

        /* ── Fetch ───────────────────────────────────────────────── */

        function fetchSpreads(opts) {
            /* opts: { append: bool, offset: number, limit: number } */
            opts = opts || {};
            var limit  = opts.limit  !== undefined ? opts.limit  : PAGE_SIZE;
            var offset = opts.offset !== undefined ? opts.offset : 0;
            var append = !!opts.append;

            /* Отменяем предыдущий запрос */
            if (_abortController) {
                _abortController.abort();
            }
            _abortController = new AbortController();
            var signal = _abortController.signal;

            var url = API_BASE + '/api/spreads?sort_by=' + encodeURIComponent(currentSortBy)
                    + '&sort_dir=' + encodeURIComponent(sortDir)
                    + '&limit=' + limit + '&offset=' + offset;

            fetch(url, { signal: signal })
                .then(function(resp) {
                    if (resp.status === 429) {
                        return null;
                    }
                    if (!resp.ok) {
                        return resp.json().then(function(err) {
                            throw new Error(formatApiError(err, 'HTTP ' + resp.status));
                        });
                    }
                    return resp.json();
                })
                .then(function(data) {
                    if (!data) return;
                    lastFetchFailed = false;

                    var items = data.items || [];

                    /* Обновляем историю */
                    items.forEach(addToHistory);

                    /* Обновляем live-badge */
                    var badgeText = document.getElementById('liveBadgeText');
                    if (badgeText) {
                        var prefix = isPaused ? '⏸ LIVE · ' : 'LIVE · ';
                        badgeText.textContent = prefix + (data.total || 0) + ' пар';
                    }

                    if (append) {
                        /* Дозагрузка: добавляем к уже имеющимся */
                        lastItems = lastItems.concat(items);
                        /* Подгрузка при скролле всегда добавляется — isPaused не блокирует */
                        appendCards(items);
                    } else {
                        lastItems = items;
                        /* При паузе не перерисовываем — данные накоплены в lastItems */
                        if (!isPaused) {
                            renderCards(lastItems);
                        }
                    }

                    /* Обновляем offset только для первичной загрузки или дозагрузки */
                    if (!opts._poll) {
                        currentOffset = offset + items.length;
                    }

                    /* Обновляем sentinel-наблюдатель */
                    updateSentinelVisibility(data.total || 0);
                })
                .catch(function(err) {
                    if (err && err.name === 'AbortError') return;
                    if (!lastFetchFailed) {
                        lastFetchFailed = true;
                        var list = document.getElementById('cardsList');
                        if (!list.querySelector('.stat-card')) {
                            list.innerHTML = '';
                            var errEl = document.createElement('div');
                            errEl.className = 'screener-status';
                            errEl.textContent = (err && err.message) || 'Биржи недоступны. Повтор через 4 сек.';
                            list.appendChild(errEl);
                        }
                    }
                });
        }

        function fetchDebounced() {
            if (_debounceTimer) clearTimeout(_debounceTimer);
            _debounceTimer = setTimeout(function() {
                currentOffset = 0;
                lastItems = [];
                var list = document.getElementById('cardsList');
                list.innerHTML = '<div class="screener-status"><div class="screener-loader"></div><div>Загрузка данных...</div></div>';
                fetchSpreads({ limit: PAGE_SIZE, offset: 0 });
            }, 300);
        }

        function pollFetch() {
            /* Polling: обновляет уже загруженные пары (limit = currentOffset, offset = 0) */
            if (_abortController) {
                _abortController.abort();
            }
            _abortController = new AbortController();
            var signal = _abortController.signal;

            var loadedCount = Math.min(currentOffset || PAGE_SIZE, 100);
            var url = API_BASE + '/api/spreads?sort_by=' + encodeURIComponent(currentSortBy)
                    + '&sort_dir=' + encodeURIComponent(sortDir)
                    + '&limit=' + loadedCount + '&offset=0';

            fetch(url, { signal: signal })
                .then(function(resp) {
                    if (resp.status === 429) return null;
                    if (!resp.ok) return null;
                    return resp.json();
                })
                .then(function(data) {
                    if (!data) return;
                    lastFetchFailed = false;

                    var items = data.items || [];

                    items.forEach(addToHistory);

                    /* Обновляем badge */
                    var badgeText = document.getElementById('liveBadgeText');
                    if (badgeText) {
                        var prefix = isPaused ? '⏸ LIVE · ' : 'LIVE · ';
                        badgeText.textContent = prefix + (data.total || 0) + ' пар';
                    }

                    lastItems = items;

                    if (!isPaused) {
                        renderCards(lastItems);
                    }
                })
                .catch(function(err) {
                    if (err && err.name === 'AbortError') return;
                });
        }

        /* ── Sentinel (infinite scroll) ──────────────────────────── */

        var _sentinelObserver = null;

        function setupSentinel() {
            var sentinel = document.getElementById('sentinel');
            if (!sentinel) return;

            _sentinelObserver = new IntersectionObserver(function(entries) {
                if (!entries[0].isIntersecting) return;
                /* Если ещё есть страницы — подгружаем */
                if (currentOffset < (_totalItems || 0)) {
                    fetchSpreads({ limit: PAGE_SIZE, offset: currentOffset, append: true });
                }
            }, { rootMargin: '100px' });

            _sentinelObserver.observe(sentinel);
        }

        var _totalItems = 0;

        function updateSentinelVisibility(total) {
            _totalItems = total;
        }

        /* ── Pause on scroll (touch + wheel) ────────────────────── */

        var cardsList = document.getElementById('cardsList');

        function activatePause() {
            isPaused = true;
            var badgeText = document.getElementById('liveBadgeText');
            if (badgeText && badgeText.textContent.indexOf('⏸') === -1) {
                badgeText.textContent = '⏸ ' + badgeText.textContent;
            }
            if (_pauseTimer) clearTimeout(_pauseTimer);
            _pauseTimer = setTimeout(function() {
                isPaused = false;
                renderCards(lastItems);
                var bt = document.getElementById('liveBadgeText');
                if (bt) bt.textContent = bt.textContent.replace(/^⏸\s*/, '');
            }, 3000);
        }

        cardsList.addEventListener('wheel', activatePause, { passive: true });
        cardsList.addEventListener('touchmove', activatePause, { passive: true });

        /* ── Strategy tabs (сортировка + направление) ────────────── */

        var tabSortMap = {
            'arb':     'spread_pct',
            'funding': 'funding',
            'combo':   'total_yield_pct'
        };

        function updateTabLabel(btn, isActive) {
            var base = btn.dataset.label;
            if (!base) {
                /* Сохраняем исходный текст однократно */
                btn.dataset.label = btn.textContent.trim();
                base = btn.dataset.label;
            }
            if (isActive) {
                btn.textContent = base + ' ' + (sortDir === 'desc' ? '↓' : '↑');
            } else {
                btn.textContent = base;
            }
        }

        document.querySelectorAll('#strategyTabs .strat-tab').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var clickedTab = this.dataset.strategy;
                if (clickedTab === currentTab) {
                    /* Переключаем направление */
                    sortDir = sortDir === 'desc' ? 'asc' : 'desc';
                } else {
                    /* Новый таб — сбрасываем на desc */
                    currentTab = clickedTab;
                    sortDir = 'desc';
                    currentSortBy = tabSortMap[currentTab] || 'spread_pct';

                    document.querySelectorAll('#strategyTabs .strat-tab').forEach(function(b) {
                        b.classList.remove('strat-active');
                        updateTabLabel(b, false);
                    });
                    this.classList.add('strat-active');
                }

                updateTabLabel(this, true);
                haptic('selection');
                fetchDebounced();
            });
        });

        /* Инициализируем метки табов при загрузке */
        document.querySelectorAll('#strategyTabs .strat-tab').forEach(function(btn) {
            var isActive = btn.classList.contains('strat-active');
            if (isActive) {
                currentTab = btn.dataset.strategy;
                currentSortBy = tabSortMap[currentTab] || 'spread_pct';
            }
            btn.dataset.label = btn.textContent.trim();
            updateTabLabel(btn, isActive);
        });

        /* ── Init ────────────────────────────────────────────────── */

        setupSentinel();
        fetchSpreads({ limit: PAGE_SIZE, offset: 0 });
        pollIntervalId = setInterval(pollFetch, 4000);
    </script>
</body>
</html>
